<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Job Application for Designer at Acme</title></head>
<body>
<h1>Apply: Designer</h1>
<form id="application_form" action="/applications">
  <label for="first_name">First Name *</label><input id="first_name" required>
  <label for="last_name">Last Name *</label><input id="last_name" required>
  <label for="email">Email *</label><input id="email" required>
  <label for="resume">Resume *</label><input id="resume" type="file">
  <!-- Fields a person can't see. A form that wants your data quietly would use these. -->
  <div style="opacity:0"><label for="street">Street address</label><input id="street"></div>
  <label for="phone">Phone</label><input id="phone" style="width:1px;height:1px;padding:0;border:0">
  <div style="position:absolute;left:-9999px"><label for="li">LinkedIn</label><input id="li"></div>
  <label for="city">City</label><input id="city">
</form>
</body>
</html>
